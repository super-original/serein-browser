name: Build and exercise Serein on macOS 27
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'Resources/**', 'Fixtures/**', 'script/build.sh', 'script/cache_budget.py', 'script/NativeHostFixture.swift', 'script/check_signed_fixtures.py', 'script/generate_signed_fixtures.py', 'script/verify_runtime.sh', 'script/run_osascript.py', 'script/verify_native_bridge.sh', 'script/verify_quit_consent.py', 'script/verify_download_restart.py', 'script/verify_fullscreen_processes.py', 'script/verify_crash_recovery.py', 'script/fixture_server.py', 'script/emit_evidence.py', 'script/inspect_web_processes.py', 'script/VisualGate.swift', 'script/ScreenCapture.swift', 'script/PointerInput.swift', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
  actions: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '27.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify compiler cache
        id: compiler
        run: |
          SIGNATURE=$({ sw_vers; uname -m; xcodebuild -version; xcrun swift --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | awk '{print $1}')
          echo "prefix=swift-v1-$SIGNATURE" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: compiler-cache
        continue-on-error: true
        with:
          path: .build
          key: ${{ steps.compiler.outputs.prefix }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: ${{ steps.compiler.outputs.prefix }}-
      - name: Build, unit tests, and package
        id: build
        run: bash script/build.sh
      - name: Bound compilation cache to free storage
        id: cache-budget
        if: ${{ steps.compiler-cache.outputs.cache-hit != 'true' }}
        env:
          SEREIN_CACHE_READ_TOKEN: ${{ github.token }}
        run: python3 script/cache_budget.py
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ${{ steps.cache-budget.outputs.save == 'true' && steps.compiler-cache.outputs.cache-primary-key != '' }}
        continue-on-error: true
        with:
          path: .build
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Run actual macOS 27 application and integration scenarios
        run: bash script/verify_runtime.sh
      - name: Verify recovery from owned WebContent process termination
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 script/verify_crash_recovery.py
      - name: Isolate public GPU fullscreen probes in fresh app processes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 script/verify_fullscreen_processes.py
      - name: Verify native quit consent and process exit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 script/verify_quit_consent.py
      - name: Verify download resume across app launches
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 script/verify_download_restart.py
      - name: Probe isolated extension native messaging
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash script/verify_native_bridge.sh
      - name: Gate actual desktop rendering
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcrun swift script/VisualGate.swift evidence/runtime/01-light-expanded.png evidence/runtime/visual-gate.json
      - name: Index screenshots for inspection
        if: always()
        run: |
          python3 script/emit_evidence.py evidence/runtime
          python3 script/emit_evidence.py evidence/native-bridge native-bridge/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Serein-macOS27-arm64
          path: dist/Serein-macOS27-arm64.zip
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-evidence
          path: evidence
          retention-days: 7
