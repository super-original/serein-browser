name: Bounded public WebKit build experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/webkit-build-probe.yml'
      - 'script/webkit_build_experiment.py'
      - 'script/bounded_build.py'
      - 'script/test_bounded_build.py'
permissions:
  contents: read
concurrency:
  group: webkit-build-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-probe:
    runs-on: xcode-27
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test resource supervisor
        run: PYTHONDONTWRITEBYTECODE=1 python3 script/test_bounded_build.py
      - name: Measure bounded public SDK engine build
        run: PYTHONDONTWRITEBYTECODE=1 python3 script/webkit_build_experiment.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: webkit-build-feasibility
          path: evidence/webkit-build
          retention-days: 7
