if(query.has('cookie'))document.cookie='sereinIcon='+query.get('cookie')+';path=/;SameSite=Lax';
const icons={normal:'/icon-fixture.png',cookie:'/icon-cookie.png?value='+encodeURIComponent(query.get('value')||''),cross:'http://localhost:8765/icon-fixture.png',redirect:'/icon-redirect',large:'/icon-large',stream:'/icon-stream-large',wide:'/icon-wide.png',invalid:'/download.txt',slow:'/icon-slow',file:'file:///tmp/never-read.png'};
